<footer class="site-footer">
  <div class="wrap">
    <div class="footer-inner">
      <div class="footer-brand">
        <div>
          <app-brand />
          <p class="footer-tagline">.NET &amp; Angular software engineer.</p>
        </div>
      </div>
      <nav class="footer-nav" aria-label="Footer">
        <p class="footer-col-title">Explore</p>
        @for (link of navLinks; track link.path) {
          <a [routerLink]="link.path">{{ link.label }}</a>
        }
        <a [href]="links.resume" target="_blank" rel="noopener">Résumé</a>
      </nav>
      <div class="socials">
        <p class="footer-col-title">Connect</p>
        <a [href]="links.github" target="_blank" rel="noopener">GitHub</a>
        <a [href]="links.linkedin" target="_blank" rel="noopener">LinkedIn</a>
        <a [href]="links.twitter" target="_blank" rel="noopener">Twitter</a>
        <a [href]="'mailto:' + links.email">Email</a>
      </div>
    </div>
    <div class="footer-bottom">
      <span class="copyright">&#169; {{ currentYear }} Krunal Jethva</span>
      <span class="copyright">Compiled with clean code &amp; strong coffee &#9749;</span>
    </div>
  </div>
</footer>
