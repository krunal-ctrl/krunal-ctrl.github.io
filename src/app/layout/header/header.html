<header class="site-header">
  <nav class="nav wrap" aria-label="Primary">
    <app-brand />
    <div class="primary-nav" #navPanel>
      <ul #navList>
        <span class="nav-indicator" #indicator aria-hidden="true"></span>
        @for (link of navLinks; track link.path) {
          <li><a [routerLink]="link.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: !!link.exact }" (click)="closeMenu()">{{ link.label }}</a></li>
        }
      </ul>
    </div>
    <div class="header-actions">
      <button
        class="icon-btn theme-toggle"
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="theme.mode() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        @if (theme.mode() === 'dark') {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5" />
            <path d="M12 2.5v2.5M12 19v2.5M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M2.5 12H5M19 12h2.5M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" />
          </svg>
        } @else {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M20.7 14.9A8.5 8.5 0 0 1 9.1 3.3a.75.75 0 0 0-.9-1A10 10 0 1 0 21.7 15.8a.75.75 0 0 0-1-.9Z" />
          </svg>
        }
      </button>
      <a class="icon-btn" [href]="links.github" target="_blank" rel="noopener" aria-label="GitHub">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.37.5 0 5.78 0 12.29c0 5.2 3.44 9.6 8.21 11.16.6.11.82-.25.82-.56 0-.28-.01-1.02-.02-2-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.74.08-.74 1.21.09 1.84 1.25 1.84 1.25 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.31-5.47-1.34-5.47-5.95 0-1.31.47-2.39 1.24-3.23-.12-.31-.54-1.54.12-3.21 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6.01 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.67.24 2.9.12 3.21.77.84 1.23 1.92 1.23 3.23 0 4.62-2.8 5.64-5.48 5.94.43.37.81 1.1.81 2.22 0 1.61-.01 2.9-.01 3.29 0 .32.21.69.83.57A12.02 12.02 0 0 0 24 12.29C24 5.78 18.63.5 12 .5Z"/></svg>
      </a>
      <a class="btn btn-ghost" [href]="links.resume" target="_blank" rel="noopener">Résumé ↗</a>
      <button class="nav-toggle" aria-label="Toggle menu" [attr.aria-expanded]="menuOpen()" (click)="toggleMenu()">☰</button>
    </div>
  </nav>
</header>
