<header class="site-header">
  <nav class="nav wrap" aria-label="Primary">
    <app-brand />
    <div class="primary-nav" [class.open]="menuOpen()">
      <ul>
        @for (link of navLinks; track link.path) {
          <li><a [routerLink]="link.path">{{ link.label }}</a></li>
        }
      </ul>
    </div>
    <div class="header-actions">
      <a class="btn btn-ghost" [href]="links.resume" target="_blank" rel="noopener">Résumé ↗</a>
      <button class="nav-toggle" aria-label="Toggle menu" [attr.aria-expanded]="menuOpen()" (click)="toggleMenu()">☰</button>
    </div>
  </nav>
</header>
<main>
  <section class="hero not-found-hero">
    <div class="wrap">
      <h1 class="gradient-text">404</h1>
      <p class="lead">This page wandered off. Let's get you back on track.</p>
      <a class="btn btn-primary" routerLink="/">← Back home</a>
    </div>
  </section>
</main>
